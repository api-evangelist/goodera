name: Goodera MCP Server
slug: goodera-mcp
description: Remote Model Context Protocol server operated by Goodera. Announced on the Goodera blog as
  the first MCP server from a social impact company, bringing real-time volunteering data to AI agents
  and LLM-powered workflows. API Evangelist reached the endpoint anonymously and completed a full initialize
  + tools/list handshake, so every tool and input schema recorded here is the server's own response, not
  a derivation.
deployment:
  mode: remote
  endpoint: https://mcp.goodera.com/mcp
  transport: streamable-http
  install: null
  package: null
  auth: none
  verified: probed
  note: The endpoint URL is not printed in Goodera's public documentation or in the launch blog post;
    API Evangelist resolved mcp.goodera.com by DNS and confirmed the MCP surface by protocol handshake.
    GET /mcp returns HTTP 406 with a JSON-RPC error demanding text/event-stream, which is the MCP streamable-HTTP
    signature. POST initialize returned HTTP 200, an mcp-session-id header, and a full server capability
    block with no credential of any kind supplied. No OAuth challenge was issued and neither /.well-known/oauth-protected-resource
    nor /.well-known/oauth-authorization-server is served (both 404), so there is no discoverable authorization
    server for this resource.
