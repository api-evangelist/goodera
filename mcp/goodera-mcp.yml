observations:
- id: anonymous-tool-listing
  note: >-
    All 19 tools, with complete JSON Schema input definitions, are enumerable with no
    credential. Tool listing is not the same as tool execution and API Evangelist did not
    invoke any tool, so whether the data-returning calls are themselves anonymous is not
    established here.
- id: unauthenticated-write-tools-advertised
  note: >-
    Two of the 19 advertised tools are write/side-effect operations that send email
    (sending-email-with-template, sending-plain-html-email). They are advertised on an
    endpoint that performs no authentication at the protocol layer and publishes no
    OAuth protected-resource metadata. This is recorded as an observation about the
    published surface, not a vulnerability claim; API Evangelist did not call them.
- id: no-oauth-discovery
  note: >-
    RFC 9728 /.well-known/oauth-protected-resource returns 404 on mcp.goodera.com, as does
    /.well-known/oauth-authorization-server, so an MCP client cannot negotiate authorization
    by discovery.
- id: no-prompts-or-resources
  note: The server declares prompts and resources capabilities but publishes zero of each.
