findings:
- id: two-surfaces-two-products
  note: >-
    The MCP server and the Developer API are not two projections of one contract. The REST
    API is a write-capable partner integration surface (create events, register
    volunteers, record hours). The MCP server is a read-mostly internal-operations surface
    (clients, champions, shipments, collateral, brand guidelines) plus two email
    send tools. Only 8 of 19 tools map to anything documented on the REST side.
- id: write-asymmetry
  note: >-
    Every REST write operation is absent from MCP, and both MCP write operations
    (email send) are absent from REST. An agent and a partner integration therefore have
    disjoint mutation capabilities.
