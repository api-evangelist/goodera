    inferred_from: expand-path
- name: MasterData
  description: >-
    Key/value reference data partitioned by domain and type - the vocabulary layer the rest of
    the model validates against.
  surfaces:
  - REST GET /master-data/timezone
  - REST GET /master-data/country
  - REST GET /master-data/language
  - MCP finding-all-master-data
  - MCP finding-master-data-by-domain
  - MCP finding-master-data-by-domain-and-type
  note: >-
    The only unauthenticated part of the REST API, and the closest thing Goodera publishes to a
    vocabulary. Event creation is documented as requiring a timezone drawn from this list.
findings:
- id: mcp-model-is-larger-than-rest-model
  note: >-
    Eight entities (Activity, Client, Champion, Shipment, Rating, Collateral, BrandGuidelines,
    Attendee) are reachable over MCP and invisible over REST. The agent surface exposes more of
    the domain than the documented partner surface does.
- id: expand-paths-are-the-only-schema-documentation
  note: >-
    Goodera publishes no object reference, so the MCP expand enums are the single most
    informative description of its data model available to the public - and they exist only
    because the MCP server answers tools/list anonymously.
- id: email-as-the-volunteer-identifier
  note: >-
    Registrations and participation are keyed on a raw email address rather than a volunteer
    identifier. There is no documented volunteer entity, so personal data is the join key across
    the two write surfaces.
