generated: '2026-08-22'
method: derived
source: >-
  mcp/goodera-mcp-tools.json (19 probed MCP tool inputSchemas from https://mcp.goodera.com/mcp)
  and the documented response fields at https://www.goodera.com/resources/api
description: >-
  Entity-relationship graph for the Goodera platform. Derived rather than searched - Goodera
  publishes no object reference and no OpenAPI components. The relationships below are read
  from two real sources: the MCP expand enums, which name traversable relations explicitly and
  in the platform's own dotted path notation, and the documented REST response fields.
  Relationships marked inferred_from: expand-path are the platform's own naming, not ours.
identifier_convention:
  style: 24-character hexadecimal MongoDB ObjectId
  prefixed: false
  examples:
  - 610cc05de85e70001106f7d9
  - 65f96d1e1d38620012d38261
  note: >-
    Identifiers are not type-prefixed, so an id alone does not disclose which entity it
    addresses. The underlying store is MongoDB.
entities:
- name: Opportunity
  description: >-
    A bookable volunteering offering that a client can turn into an event. The primary object
    exposed to partners over REST.
  surfaces:
  - REST GET /opportunities
  - REST GET /opportunities/{id}
  - MCP search-opportunities
  - MCP retrieving-opportunity
  fields_documented:
  - id
  - name
  - eventLabel (e.g. TEAM_BASED)
  - description
  - richTextDescription
  - duration (number[], minutes)
  - countries (string[], ISO codes)
  - languages (string[])
  - beneficiaries (string[])
  - causes (string[])
  - type (e.g. AUDIOBOOK)
  - deck
  - isPaid (boolean)
  relationships:
  - to: Activity
    kind: belongs_to
    via: opportunity.activity
    inferred_from: expand-path
  - to: Event
    kind: has_many
    via: opportunityId on event creation
    inferred_from: documented-request-field
  formats:
  - in_office
  - virtual
  - outdoor
  - kiosk
- name: Activity
  description: >-
    The catalog layer beneath an opportunity - the underlying volunteering activity, with
    variants and beneficiary attributes. Exposed only over MCP; absent from the REST reference.
  surfaces:
  - MCP search-activities
  - MCP retrieving-activity
  relationships:
  - to: ActivityVariant
    kind: has_many
    via: variants
    inferred_from: expand-path
  - to: BeneficiaryAttribute
    kind: has_many
    via: beneficiaryAttributes
    inferred_from: expand-path
  segmentation:
    business_unit:
    - global
    - india
    deliverable_type:
    - physical
    - digital
    - not_available
  note: >-
    The business_unit enum (global / india) discloses that the catalog is partitioned by
    operating region, a fact not stated anywhere in the public documentation.
- name: Event
  description: >-
    A scheduled instance of an opportunity, booked by a client for a date, timezone and
    location. The richest entity in the model and the hub of the graph.
  surfaces:
  - REST POST /events
  - REST GET /events/{eventId}
  - MCP listing-events
  - MCP retrieving-event
  fields_documented:
  - opportunityId
  - startTimeStamp (ISO 8601)
  - endTimeStamp (ISO 8601)
  - timezone (from master-data list)
  - country
  - language
  - email
  - name
  - expectedVolunteerCount
  - eventLocation (city, country, coordinates, address)
  - addressLine
  - createdAt
  states:
  - upcoming
  - ongoing
  - completed
  - cancelled
  relationships:
  - to: Opportunity
    kind: belongs_to
    via: opportunity.activity
    inferred_from: expand-path
  - to: Client
    kind: belongs_to
    via: client
    inferred_from: expand-path
  - to: Champion
    kind: has_many
    via: eventChampion.champion
    inferred_from: expand-path
  - to: Partner
    kind: belongs_to
    via: partner
    inferred_from: expand-path
  - to: Address
    kind: has_one
    via: address
    inferred_from: expand-path
  - to: Attendee
    kind: has_many
    via: attendeeDenorm
    inferred_from: expand-path
  - to: Goodfie
    kind: has_many
    via: goodfies
    inferred_from: expand-path
  - to: ActivityVariant
    kind: has_one
