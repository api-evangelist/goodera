- name: Client
  description: >-
    The enterprise customer that books events. Exposed over MCP only; a partner using the REST
    API never sees this object.
  surfaces:
  - MCP listing-clients
  - MCP retrieving-brand-guidelines
  relationships:
  - to: Event
    kind: has_many
    via: clientId filter
    inferred_from: mcp-input-field
  - to: BrandGuidelines
    kind: has_one
    via: retrieving-brand-guidelines
    inferred_from: mcp-tool
  - to: OrganizationConfiguration
    kind: has_one
    via: webhookUrl / inPersonWebhookUrl config object
    inferred_from: documented-response-field
- name: Champion
  description: >-
    An employee who leads or coordinates volunteering at a client. Exposed over MCP only.
  surfaces:
  - MCP listing-champions
  relationships:
  - to: Client
    kind: belongs_to
    via: client
    inferred_from: expand-path
  - to: Customer
    kind: belongs_to
    via: customer
    inferred_from: expand-path
  - to: Event
    kind: has_many
    via: eventChampion.champion
    inferred_from: expand-path
- name: Registration
  description: A volunteer's enrolment on an event, keyed by email address.
  surfaces:
  - REST POST /registrations
  - REST DELETE /registrations/{registrationId}
  - REST GET /registrations/by_event/{eventId}
  fields_documented:
  - registrationId
  - eventId
  - email
  relationships:
  - to: Event
    kind: belongs_to
    via: eventId
    inferred_from: documented-request-field
  note: >-
    The only entity with a documented delete operation, and therefore the only reversible write
    on the API. See the reversibility block in conventions/goodera-conventions.yml.
- name: Participation
  description: >-
    A record that a volunteer attended, which is what becomes a reportable volunteer hour.
  surfaces:
  - REST POST /participation
  - MCP retrieving-event-participation-details
  fields_documented:
