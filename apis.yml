apis:
- aid: goodera-developer-api
  name: Goodera Developer API
  description: 'REST API for volunteering partners to list Goodera volunteer opportunities
    inside their own platform, create volunteering events against an opportunity,
    register and de-register volunteers, and record participation for volunteer-hour
    tracking. JSON over HTTPS, API key in the x-api-key header, with an unauthenticated
    master-data surface for timezone, country and language reference lists.'
