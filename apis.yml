- aid: goodera-mcp
  name: Goodera MCP Server
  description: 'Remote Model Context Protocol server announced as the first from a
    social impact company, exposing live Goodera volunteering data to AI agents and
    LLM workflows. Streamable HTTP transport at https://mcp.goodera.com/mcp, server
    name "Goodera MCP" version 1.14.1, protocol 2025-06-18, answering initialize and
    tools/list anonymously with 19 tools across events, clients, champions, master
    data, activities, opportunities and templated email.'
