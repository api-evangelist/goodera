aid: goodera
name: Goodera
description: 'Goodera is a B2B SaaS corporate volunteering and social impact platform
  that curates, hosts and manages employee volunteering programs for enterprises,
  working with a stated 50,000+ vetted nonprofit partners across 100+ countries in
  virtual, in-person, outdoor and in-office formats. For integrators it publishes a
  REST Developer API at developer-api.goodera.com covering volunteering opportunities,
  event creation, registrations and participation/hours tracking, authenticated with
  an x-api-key header, and it operates a remote Model Context Protocol server at
  mcp.goodera.com that exposes 19 anonymous-readable tools over the same events,
  clients, champions, activities, opportunities and master-data domains.'
